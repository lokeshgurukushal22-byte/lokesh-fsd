<html>
<head>
    <script>
        function add() {
           
            var a = parseInt(document.getElementById("a1").value);
            var b = parseInt(document.getElementById("a2").value);
            var c = a + b;
            document.getElementById("result").value = c;

            var a1 = parseInt(document.getElementsByName("b1")[0].value);
            var b1 = parseInt(document.getElementsByName("b2")[0].value);
            var c1 = a1 + b1;
            document.getElementById("result1").value = c1;
        }
    </script>
</head>
<body>
    <input type="text" id="a1">
    <input type="text" id="a2"><br><br>

    <input type="text" name="b1">
    <input type="text" name="b2"><br><br>

    <button onclick="add()">Click</button><br><br>

    <input type="text" id="result" placeholder="Result using ID"><br><br>
    <input type="text" id="result1" placeholder="Result using Name">
</body>
</html>
